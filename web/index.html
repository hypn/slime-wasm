<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLIME</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #aaa; font: 14px/1.4 monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #screen { display: block; background: #000; image-rendering: pixelated; cursor: none; touch-action: none;
            width: min(100vw, calc((100vh - 40px) * 4 / 3)); aspect-ratio: 4 / 3; }
  body.square #screen { width: min(100vw, calc((100vh - 40px) * 1.6)); aspect-ratio: 8 / 5; }
  #bar { height: 40px; display: flex; gap: 1.5em; align-items: center; opacity: .6; }
  #bar a { color: inherit; cursor: pointer; text-decoration: underline; }
  #over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #over span { background: #000; padding: .4em .8em; border: 1px solid #555; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="bar">
  <span>left: draw &middot; right: water &middot; P: pause &middot; space: quit</span>
  <a id="aspect">pixel shape: 4:3 (CRT)</a>
  <span>drop a 320x200 8-bit .BMP here, then press L</span>
</div>
<div id="over"><span>Program terminated. Press any key to restart.</span></div>
<script src="slime.js"></script>
<script>
(() => {
  // Simulation iterations per second. The DOS original ran its loop flat out, so its speed
  // depended on the CPU; this is the one tuning knob. Override with ?sps=NN
  const params = new URLSearchParams(location.search);
  const SPS = Math.max(1, +params.get('sps') || 60);

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(320, 200);
  const over = document.getElementById('over');
  let slime = null, last = 0, acc = 0, pointer = null, bitmap = null, ended = false;

  async function start() {
    const M = await createSlime();
    const api = {
      M,
      init: M.cwrap('slime_init', null, []),
      step: M.cwrap('slime_step', 'number', []),
      mouse: M.cwrap('slime_mouse', null, ['number', 'number', 'number']),
      key: M.cwrap('slime_key', null, ['number']),
      present: M.cwrap('slime_present', 'number', []),
    };
    if (bitmap) M.FS.writeFile('/bitmap.bmp', bitmap);   // what the original read from c:\bitmap.bmp
    api.init();
    slime = api; ended = false; over.style.display = 'none'; acc = 0; last = performance.now();
    if (pointer) api.mouse(pointer.x, pointer.y, pointer.b);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!slime) return;
    acc = Math.min(acc + (now - last), 250); last = now;
    try {
      let n = Math.floor(acc * SPS / 1000);
      acc -= n * 1000 / SPS;
      while (n-- > 0 && !ended) if (!slime.step()) { ended = true; over.style.display = 'flex'; }
      const p = slime.present() >> 2;
      image.data.set(new Uint8Array(slime.M.HEAPU32.buffer, p * 4, 64000 * 4));
      ctx.putImageData(image, 0, 0);
    } catch (e) {                  // wasm trap: don't leave a dead tab, boot a fresh instance
      console.error(e); slime = null; start();
    }
  }

  // ---- mouse: driver units are x 0..639, y 0..199 (the original halves x)
  function setPointer(e) {
    const r = canvas.getBoundingClientRect();
    pointer = { x: Math.floor((e.clientX - r.left) / r.width * 640), y: Math.floor((e.clientY - r.top) / r.height * 200), b: e.buttons & 7 };
    if (slime) slime.mouse(pointer.x, pointer.y, pointer.b);
  }
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); setPointer(e); e.preventDefault(); });
  canvas.addEventListener('pointermove', setPointer);
  canvas.addEventListener('pointerup', setPointer);
  canvas.addEventListener('pointercancel', setPointer);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ---- keyboard: the game only reads characters via getch()
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (ended) { e.preventDefault(); start(); return; }
    if (e.key.length === 1) { e.preventDefault(); if (slime) slime.key(e.key.charCodeAt(0)); }
  });

  // ---- optional: drop a bitmap so the hidden 'L' key has something to load
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', async e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0]; if (!f) return;
    bitmap = new Uint8Array(await f.arrayBuffer());
    if (slime) slime.M.FS.writeFile('/bitmap.bmp', bitmap);
  });

  document.getElementById('aspect').addEventListener('click', e => {
    const sq = document.body.classList.toggle('square');
    e.target.textContent = sq ? 'pixel shape: square (8:5)' : 'pixel shape: 4:3 (CRT)';
  });

  start(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
